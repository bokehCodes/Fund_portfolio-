
name: Unzip Uploaded File
on:
  push:
    paths:
      - '**/*.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and clean up
        run: |
          while IFS= read -r -d '' archive; do
            unzip -o "$archive" -d "$(dirname "$archive")"
            rm -- "$archive"
          done < <(find . -type f -name '*.zip' -not -path './.git/*' -print0)
      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract zip contents"
          git push
